# Monthly, grouped version updates, each at least 7 days old: a release that
# turns out to be malicious is usually pulled within days. Security updates
# come as soon as an advisory lands, whatever this file says.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
  # Base images in deploy/Dockerfile, tag and digest together.
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    ignore:
      # Only even-numbered Node releases become LTS; move majors by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]

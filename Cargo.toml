[workspace]
resolver = "2"
members = ["crates/flinch-archive", "crates/flinch-web"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/tobhoster/flinch"
# An application, not a library: nothing here goes to crates.io.
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Test-only: table-driven cases (rstest) and invariants over generated inputs
# (proptest). Dev-dependencies only; never in a shipped binary.
rstest = "0.27"
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package]
name = "flinch-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flinch-archive = { path = "../flinch-archive" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = "0.8"
anyhow = { workspace = true }
thiserror = { workspace = true }
# Single sign-on (auth/oidc): the provider's discovery, token, userinfo and
# JWKS calls. All four crates are already in the tree through reqwest and
# rustls; ring checks the ID token's signature and hashes the PKCE verifier,
# base64 decodes the token's parts and the JWK's numbers, url builds the
# authorization request and the token endpoint's Basic credentials.
reqwest = { workspace = true }
ring = "0.17"
base64 = "0.22"
url = "2"

[dev-dependencies]
rstest = { workspace = true }
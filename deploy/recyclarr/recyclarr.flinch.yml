# Suggested changes to your Recyclarr root config (recyclarr.yml), for
# libraries FLINCH manages. Merge them into your own config and run
# `recyclarr sync --preview` before the next sync.
#
# Why these belong in the ROOT config and not an include: Recyclarr merges the
# root last and it always wins, so if your root already sets `upgrade` or
# `qualities` for a profile, an include cannot change them.
#
# What each change buys, largest first (sources: TRaSH guides and the
# Recyclarr v8.7 reference):
#
# 1. A compact tier per app. FLINCH advises, per item, premium vs compact from
#    the same calibrated household evidence it uses for eviction; the tier has
#    to exist before an item can use it. Recyclarr defines it; FLINCH only
#    ever moves items between the two names below and never writes a profile.
# 2. Stop endless upgrades. `until_score: 10000` is unreachable for a WEB
#    release (a strong WEB 2160p release scores about 5.2k), and a
#    `min_upgrade_format_score` of 1 lets a +5 repack or a +75 streaming-service
#    tag re-download a 20 GB file. With a recycle bin on the same volume, every
#    such upgrade also parks the old file there.
# 3. Drop the Remux-1080p stop-over in the Radarr ladder: a movie with no 4K
#    WEB release grabs a 20-40 GB remux, then upgrades to WEB 2160p anyway.
#    `enabled: false` keeps the quality in place so the ordering stays safe.
# 4. Tie-break toward smaller files. With preferred near max, when every other
#    comparison ties, the largest release wins. `preferred_ratio` only moves the
#    last tie-breaker (after quality, custom-format score, protocol, indexer,
#    peers), so it cannot reject anything.

sonarr:
  sonarr-main:
    base_url: http://sonarr:8989
    # api_key: your Sonarr API key
    quality_definition:
      type: series
      preferred_ratio: 0.2
    quality_profiles:
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined) — premium tier
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 2000 # a strong WEB release ≈ 1700 tier + 500 HDR + 75 service
        min_upgrade_format_score: 250
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p — FLINCH compact tier
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 2000
        min_upgrade_format_score: 250
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p, left as TRaSH defines it
        reset_unmatched_scores:
          enabled: true

radarr:
  radarr-main:
    base_url: http://radarr:7878
    # api_key: your Radarr API key
    quality_definition:
      type: movie
      preferred_ratio: 0.2
    quality_profiles:
      - trash_id: d1d310673359205736b4b84acd5ea8c8 # Remux 2160p (Combined) — premium tier
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 5000 # not 10000; a strong WEB release ≈ 1700 + 500 HDR + 3000 DD+ Atmos
        min_upgrade_format_score: 500 # not 1
        qualities:
          - name: WEB 2160p
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: Remux-1080p
            enabled: false
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
      - trash_id: e8c5acb741363a0dbda67d3978f4912f # WEB 1080p — FLINCH compact tier
        reset_unmatched_scores:
          enabled: true
        min_upgrade_format_score: 500
